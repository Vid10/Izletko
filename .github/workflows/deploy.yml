name: Build in deploy na Azure

on:
  push:
    branches: [ master, Git-Actions ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: Izletko        
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/izletko

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Prijava v Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

     
      - name: Build in push Docker slike
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Projekt/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

     
      - name: Deploy na Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_OBJAVI_PROFIL }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}
